[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

# Gensyn Mainnet (chainId 685689). Native currency: ETH.
# Public RPC requires Alchemy key:
#   GENSYN_MAINNET_RPC=https://gensyn-mainnet.g.alchemy.com/v2/<your-key>
# Verifier: Blockscout-style explorer at gensyn-mainnet.explorer.alchemy.com.
[rpc_endpoints]
gensyn_mainnet = "${GENSYN_MAINNET_RPC}"

[etherscan]
gensyn_mainnet = { key = "${GENSYN_EXPLORER_KEY}", url = "https://gensyn-mainnet.explorer.alchemy.com/api", chain = 685689 }
