name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Foundry tests (SynodRegistry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std (not vendored)
        run: forge install foundry-rs/forge-std --no-commit
      - name: forge build
        run: forge build --sizes
      - name: forge test (with fuzz)
        run: forge test -vv

  settler:
    name: Settler unit tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: settler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements.txt
      - name: pytest
        run: pytest -q

  ui:
    name: UI typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: Build (includes TypeScript check)
        env:
          # Disable ENS bootstrap during CI build — no network access on cold-boot
          SYNOD_UI_DISABLE_ENS: "1"
          SYNOD_RPC_URL: "https://gensyn-mainnet.g.alchemy.com/public"
          SYNOD_REGISTRY_ADDRESS: "0xD387f749667590940d7c68CA350e57FbcE62b6ad"
        run: npm run build
